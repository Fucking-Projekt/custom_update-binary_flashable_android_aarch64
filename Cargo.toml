[package]
name = "femboy"
version = "0.1.0"
edition = "2021"

[dependencies]
sevenz-rust = "0.6"
zip = "2.2"
libc = "0.2"
obfstr = "0.4"

[[bin]]
name = "femboy"
path = "src/main.rs"

[[bin]]
name = "unzip_64"
path = "src/bin/unzip_64.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
